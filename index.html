<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ParfumHouse</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1A0F16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #1A0F16;
            --card-bg: #251820;
            --text-primary: #F5F0EB;
            --text-secondary: #A89B93;
            --accent: #D4A574;
            --accent-hover: #E5B885;
            --border-radius: 16px;
            --skeleton-base: #2A1D24;
            --skeleton-shine: #36262F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px; /* Отступ под футер */
        }

        /* === СКЕЛЕТОН-ЛОАДЕР === */
        .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .skeleton-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .skeleton-img { width: 100%; height: 70%; background: var(--skeleton-base); }
        .skeleton-text { margin: 12px; height: 12px; border-radius: 6px; background: var(--skeleton-base); }
        .skeleton-text.short { width: 60%; margin-top: 8px; }

        .skeleton-img, .skeleton-text { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .skeleton-grid.hidden { display: none; }

        /* === ОСНОВНОЙ КОНТЕНТ === */
        #products-grid {
            display: none; /* Скрыт до загрузки */
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
        }

        .product-card:active { transform: scale(0.97); }
        .product-card.out-of-stock { opacity: 0.5; pointer-events: none; }

        .product-img-wrap {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--skeleton-base);
            overflow: hidden;
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--skeleton-base), var(--card-bg));
            font-size: 32px;
        }

        .product-info { padding: 10px 12px 14px; }
        .product-brand { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .product-name { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 14px; color: var(--accent); font-weight: 700; }

        .stock-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        .stock-badge.no { color: #ff6b6b; }

        /* === BOTTOM SHEET === */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .overlay.active { opacity: 1; visibility: visible; }

        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg);
            border-radius: 24px 24px 0 0;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
        }
        .bottom-sheet.active { transform: translateY(0); }

        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .sheet-title { font-size: 20px; font-weight: 700; line-height: 1.3; flex: 1; margin-right: 12px; }
        .sheet-brand { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .sheet-close { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: var(--text-primary); font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .sheet-img { width: 100%; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: var(--skeleton-base); }
        .sheet-img img { width: 100%; height: 100%; object-fit: cover; }

        /* Пирамида аромата */
        .pyramid { margin-bottom: 16px; }
        .pyramid-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .pyramid-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; width: 50px; flex-shrink: 0; }
        .pyramid-notes { font-size: 13px; color: var(--text-primary); line-height: 1.4; }
        .pyramid-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }

        .sheet-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }

        /* Чипсы выбора объема */
        .volume-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .chip {
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid transparent;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .chip.selected { border-color: var(--accent); background: rgba(212, 165, 116, 0.15); color: var(--accent); }
        .chip:active { transform: scale(0.95); }

        .order-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: var(--accent);
            color: #1A0F16;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .order-btn:hover { background: var(--accent-hover); }
        .order-btn:active { transform: scale(0.98); }

        /* Футер */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .footer a { color: var(--text-secondary); text-decoration: none; opacity: 0.6; }
        .footer a:hover { opacity: 1; }

        /* Ошибка загрузки */
        .error-state {
            grid-column: span 2;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .error-state p:first-child { font-size: 40px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <!-- СКЕЛЕТОН-ЛОАДЕР -->
    <div id="skeleton-loader" class="skeleton-grid">
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    </div>

    <!-- СЕТКА ТОВАРОВ -->
    <div id="products-grid"></div>

    <!-- OVERLAY + BOTTOM SHEET -->
    <div class="overlay" id="overlay"></div>
    <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-header">
            <div>
                <div class="sheet-brand" id="sheet-brand"></div>
                <div class="sheet-title" id="sheet-title"></div>
            </div>
            <button class="sheet-close" id="sheet-close">✕</button>
        </div>
        <div class="sheet-img" id="sheet-img-wrap"></div>
        <div class="pyramid" id="sheet-pyramid"></div>
        <div class="sheet-desc" id="sheet-desc"></div>
        <div class="volume-chips" id="sheet-chips"></div>
        <button class="order-btn" id="order-btn">Заказать</button>
    </div>

    <!-- ФУТЕР -->
    <div class="footer">
        <a href="https://t.me/LevelApp_am" target="_blank">made by LevelApp</a>
    </div>

<script>
// =============================================
// ⚙️ НАСТРОЙКИ — ИЗМЕНИТЬ ПЕРЕД ВЫДАЧЕЙ
// =============================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMSpQwstchHCeBia5-2c67KFHPzkid8DCUqmHwZ6TanFD8H2VtwnNenQnByu0qyenKqVJx8ERTkv4s/pub?gid=0&single=true&output=csv"; // ← Вставить CSV-ссылку из Google Таблицы
const TELEGRAM_USERNAME = "Kristine_parfum"; // ← Telegram-ник продавца без @
// =============================================

// Инициализация Telegram WebApp
const tg = window.Telegram?.WebApp;
let isTelegram = false;

if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#1A0F16');
    isTelegram = true;
}

// Парсер Google Drive ссылок → прямая ссылка на изображение
function getDriveImageUrl(url) {
    if (!url || !url.includes('drive.google.com')) return url;
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (!match) return null;
    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
}

// Парсинг CSV
function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    return lines.slice(1).filter(line => line.trim()).map(line => {
        const values = line.split(',');
        const obj = {};
        headers.forEach((h, i) => obj[h] = (values[i] || '').trim());
        return obj;
    });
}

// Рендер сетки товаров
function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    grid.innerHTML = '';

    if (!products.length) {
        grid.innerHTML = '<div class="error-state"><p>🫙</p><p>Каталог пуст.<br>Проверьте Google Таблицу.</p></div>';
        return;
    }

    products.forEach(p => {
        const inStock = (p.stock || '').toLowerCase() !== 'no';
        const imgUrl = getDriveImageUrl(p.photo);
        const firstPrice = p.price1 ? `${Number(p.price1).toLocaleString('ru-RU')} ₽` : '';

        const card = document.createElement('div');
        card.className = `product-card${!inStock ? ' out-of-stock' : ''}`;
        card.dataset.product = JSON.stringify(p);
        card.innerHTML = `
            <div class="product-img-wrap">
                ${imgUrl 
                    ? `<img src="${imgUrl}" alt="${p.name}" loading="lazy">` 
                    : `<div class="no-image-placeholder">🫧</div>`}
            </div>
            ${!inStock ? '<div class="stock-badge no">Нет в наличии</div>' : ''}
            <div class="product-info">
                <div class="product-brand">${p.brand || ''}</div>
                <div class="product-name">${p.name || ''}</div>
                <div class="product-price">${firstPrice}</div>
            </div>
        `;
        if (inStock) card.addEventListener('click', () => openSheet(p));
        grid.appendChild(card);
    });
}

// Открытие Bottom Sheet
let currentProduct = null;
let selectedVolume = null;

function openSheet(product) {
    currentProduct = product;
    
    // Заполняем данные
    document.getElementById('sheet-brand').textContent = product.brand || '';
    document.getElementById('sheet-title').textContent = product.name || '';
    document.getElementById('sheet-desc').textContent = product.desc || '';

    // Фото
    const imgUrl = getDriveImageUrl(product.photo);
    const imgWrap = document.getElementById('sheet-img-wrap');
    imgWrap.innerHTML = imgUrl 
        ? `<img src="${imgUrl}" alt="${product.name}">` 
        : `<div class="no-image-placeholder" style="height:100%">🫧</div>`;

    // Пирамида
    const pyramidEl = document.getElementById('sheet-pyramid');
    const notes = [
        { label: 'Верх', value: product.top },
        { label: 'Сердце', value: product.heart },
        { label: 'База', value: product.base }
    ].filter(n => n.value);
    
    if (notes.length) {
        pyramidEl.style.display = 'block';
        pyramidEl.innerHTML = notes.map((n, i) => `
            ${i > 0 ? '<div class="pyramid-divider"></div>' : ''}
            <div class="pyramid-row">
                <span class="pyramid-label">${n.label}</span>
                <span class="pyramid-notes">${n.value}</span>
            </div>
        `).join('');
    } else {
        pyramidEl.style.display = 'none';
    }

    // Чипсы объёмов
    const chipsEl = document.getElementById('sheet-chips');
    chipsEl.innerHTML = '';
    const volumes = [];
    for (let i = 1; i <= 3; i++) {
        if (product[`vol${i}`] && product[`price${i}`]) {
            volumes.push({ vol: product[`vol${i}`], price: product[`price${i}`] });
        }
    }

    selectedVolume = volumes[0] || null;

    volumes.forEach((v, idx) => {
        const chip = document.createElement('div');
        chip.className = `chip${idx === 0 ? ' selected' : ''}`;
        chip.textContent = `${v.vol} мл · ${Number(v.price).toLocaleString('ru-RU')} ₽`;
        chip.addEventListener('click', () => {
            selectedVolume = v;
            chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            updateOrderBtn();
            if (isTelegram) tg.HapticFeedback?.selectionChanged();
        });
        chipsEl.appendChild(chip);
    });

    updateOrderBtn();

    // Показываем sheet
    document.getElementById('overlay').classList.add('active');
    document.getElementById('bottom-sheet').classList.add('active');

    // Telegram BackButton
    if (isTelegram) {
        tg.BackButton.show();
        tg.BackButton.onClick(closeSheet);
    }
}

function updateOrderBtn() {
    const btn = document.getElementById('order-btn');
    if (selectedVolume) {
        btn.textContent = `Заказать за ${Number(selectedVolume.price).toLocaleString('ru-RU')} ₽`;
    } else {
        btn.textContent = 'Заказать';
    }
    
    // Обновляем нативную кнопку Telegram если есть
    if (isTelegram && tg.MainButton) {
        tg.MainButton.setText(btn.textContent);
        tg.MainButton.show();
        tg.MainButton.onClick(placeOrder);
    }
}

function closeSheet() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('bottom-sheet').classList.remove('active');
    if (isTelegram) {
        tg.BackButton.hide();
        tg.MainButton?.hide();
        tg.BackButton.offClick(closeSheet);
        tg.MainButton?.offClick(placeOrder);
    }
    currentProduct = null;
    selectedVolume = null;
}

function placeOrder() {
    if (!currentProduct) return;

    const volText = selectedVolume 
        ? `, объём ${selectedVolume.vol} мл` 
        : '';
    
    const message = `Хочу заказать ${currentProduct.name}${currentProduct.brand ? ' (' + currentProduct.brand + ')' : ''}${volText}`;
    const url = `https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(message)}`;

    if (isTelegram) tg.HapticFeedback?.impactOccurred('medium');
    
    window.open(url, '_blank');
    closeSheet();
}

// Закрытие по клику на overlay или кнопку ✕
document.getElementById('overlay').addEventListener('click', closeSheet);
document.getElementById('sheet-close').addEventListener('click', closeSheet);

// HTML-кнопка заказа (для веб-версии вне Telegram)
document.getElementById('order-btn').addEventListener('click', placeOrder);

// Загрузка данных
async function loadProducts() {
    const skeleton = document.getElementById('skeleton-loader');
    const grid = document.getElementById('products-grid');

    if (!SHEET_CSV_URL) {
        skeleton.classList.add('hidden');
        grid.style.display = 'grid';
        grid.innerHTML = '<div class="error-state"><p>⚙️</p><p>Не указан URL таблицы.<br>Откройте index.html и добавьте ссылку в SHEET_CSV_URL</p></div>';
        return;
    }

    try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csv = await res.text();
        const products = parseCSV(csv);
        renderProducts(products);
        skeleton.classList.add('hidden');
        grid.style.display = 'grid';
    } catch (err) {
        console.error('Load error:', err);
        skeleton.classList.add('hidden');
        grid.style.display = 'grid';
        grid.innerHTML = '<div class="error-state"><p>😔</p><p>Не удалось загрузить каталог.<br>Проверьте интернет и обновите страницу.</p></div>';
    }
}

document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
